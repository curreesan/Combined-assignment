<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Lens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Expense Lens</h1>

  <p id="balance-text">Balance: $0.00</p>

  <form id="add-form">
    <input type="text" id="description-input" placeholder="Description" required />
    <input type="number" id="amount-input" placeholder="Amount" step="0.01" required />
    <select id="category-input" required>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
    </select>
    <button type="submit">Add Transaction</button>
  </form>

  <label for="filter-select">Filter by category</label>
  <select id="filter-select">
    <option value="All">All</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Bills">Bills</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Other">Other</option>
  </select>

  <table id="transactions-table">
    <thead>
      <tr>
        <th>Description</th>
        <th>Category</th>
        <th>Amount</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="transactions-body"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
