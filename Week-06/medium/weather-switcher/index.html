<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Theme Switcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Weather Theme Switcher</h1>

  <form id="search-form">
    <input type="text" id="city-input" placeholder="Enter city name" required />
    <button type="submit">Search</button>
  </form>

  <p id="status-text"></p>

  <div id="weather-display" class="hidden">
    <p id="weather-icon"></p>
    <p id="temperature-text"></p>
    <p id="condition-text"></p>
  </div>

  <div id="override-controls">
    <label for="color-input">Override background</label>
    <input type="color" id="color-input" value="#87ceeb" />
    <button id="reset-btn">Reset to Auto</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
