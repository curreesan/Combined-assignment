<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meme Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Meme Generator</h1>

  <div id="controls">
    <label for="template-select">Template</label>
    <select id="template-select">
      <option value="https://picsum.photos/seed/meme1/500/500">Template 1</option>
      <option value="https://picsum.photos/seed/meme2/500/500">Template 2</option>
      <option value="https://picsum.photos/seed/meme3/500/500">Template 3</option>
    </select>

    <input type="text" id="top-text-input" placeholder="Top text" />
    <input type="text" id="bottom-text-input" placeholder="Bottom text" />

    <label for="color-input">Text color</label>
    <input type="color" id="color-input" value="#ffffff" />

    <button id="download-btn">Download Meme</button>
  </div>

  <canvas id="meme-canvas" width="500" height="500"></canvas>

  <script src="script.js"></script>
</body>
</html>
